<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <mask id="polis-icon-mask">
      <!-- Base rotated square with rounded corners -->
      <rect x="18" y="18" width="64" height="64" rx="16" transform="rotate(45 50 50)" fill="white" />
      <!-- Inner cutout -->
      <circle cx="50" cy="50" r="16" fill="black" />
      <!-- Diagonal gaps -->
      <rect x="0" y="48" width="100" height="4" transform="rotate(45 50 50)" fill="black" />
      <rect x="0" y="48" width="100" height="4" transform="rotate(-45 50 50)" fill="black" />
    </mask>
  </defs>

  <g mask="url(#polis-icon-mask)">
    <!-- Top (Slate Blue) -->
    <polygon points="0,0 100,0 50,50" fill="#445f7c" />
    <!-- Right (Gold) -->
    <polygon points="100,0 100,100 50,50" fill="#ba9858" />
    <!-- Bottom (Parchment) -->
    <polygon points="0,100 100,100 50,50" fill="#ecdcbe" />
    <!-- Left (Dark Navy) -->
    <polygon points="0,0 0,100 50,50" fill="#0f284d" />
  </g>

  <!-- Central dot (Dark Navy) -->
  <circle cx="50" cy="50" r="6" fill="#0f284d" />
</svg>